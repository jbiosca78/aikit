<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aikit chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-top: #f8f4ea;
            --bg-bottom: #e9f2f9;
            --panel: #fffdf9;
            --panel-2: #f6efe3;
            --ink: #1d2a34;
            --muted: #5f6b73;
            --brand: #0a8f6a;
            --brand-2: #08795a;
            --user: #132633;
            --assistant: #f3ece1;
            --border: #d4c7b5;
            --danger: #ad2f2f;
            --shadow: 0 12px 28px rgba(18, 36, 44, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            color: var(--ink);
            font-family: "IBM Plex Sans", sans-serif;
            background:
                radial-gradient(circle at 15% 10%, #fff6db 0%, rgba(255, 246, 219, 0) 35%),
                radial-gradient(circle at 85% 85%, #d6f4e8 0%, rgba(214, 244, 232, 0) 32%),
                linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
        }

        .page {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 16px;
            height: 100%;
            padding: 16px;
        }

        .sidebar {
            background: linear-gradient(180deg, #1e3340 0%, #172731 100%);
            color: #ecf4f8;
            border-radius: 18px;
            padding: 18px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .brand {
            font-family: "Space Grotesk", sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin: 0;
        }

        .tag {
            margin: 4px 0 18px;
            font-size: 13px;
            color: #b6c8d3;
        }

        .meta {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .meta .label {
            font-size: 12px;
            text-transform: uppercase;
            color: #b6c8d3;
            letter-spacing: 0.6px;
        }

        .meta .value {
            margin-top: 6px;
            font-size: 14px;
            word-break: break-word;
        }

        .actions {
            display: grid;
            gap: 10px;
            margin-bottom: 14px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 11px 14px;
            font-weight: 600;
            font-family: "IBM Plex Sans", sans-serif;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(160deg, var(--brand) 0%, var(--brand-2) 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(10, 143, 106, 0.35);
        }

        .btn-light {
            background: rgba(255, 255, 255, 0.12);
            color: #eaf4f8;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }

        .help {
            margin-top: auto;
            font-size: 13px;
            color: #b6c8d3;
            line-height: 1.4;
        }

        .chat-shell {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-height: 0;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, #fff6e8 0%, #fffdf9 100%);
            border-radius: 18px 18px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
        }

        .chat-header h1 {
            margin: 0;
            font-family: "Space Grotesk", sans-serif;
            font-size: 22px;
            font-weight: 700;
        }

        .status {
            font-size: 13px;
            color: var(--muted);
        }

        .messages {
            padding: 22px;
            overflow-y: auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .empty {
            margin: auto;
            max-width: 560px;
            text-align: center;
            color: var(--muted);
            line-height: 1.5;
            border: 1px dashed var(--border);
            border-radius: 14px;
            padding: 20px;
            background: #fffbf3;
            animation: fadeIn 260ms ease;
        }

        .message {
            max-width: min(760px, 86%);
            padding: 12px 14px;
            border-radius: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            animation: slideUp 220ms ease;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user);
            color: #f5fafc;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--assistant);
            border: 1px solid #eadfce;
            color: #22323d;
            border-bottom-left-radius: 4px;
        }

        .message.error {
            border: 1px solid #e2b4b4;
            background: #fff0f0;
            color: #6e1f1f;
        }

        .composer {
            border-top: 1px solid var(--border);
            padding: 14px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            background: #fffcf6;
            border-radius: 0 0 18px 18px;
        }

        .composer textarea {
            resize: none;
            border-radius: 12px;
            border: 1px solid #d6cab8;
            background: white;
            color: var(--ink);
            padding: 12px;
            min-height: 52px;
            max-height: 180px;
            font: inherit;
            outline: none;
        }

        .composer textarea:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(10, 143, 106, 0.12);
        }

        .send {
            min-width: 118px;
        }

        .send:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hint {
            grid-column: 1 / -1;
            font-size: 12px;
            color: var(--muted);
        }

        .dot-typing::after {
            content: "";
            display: inline-block;
            width: 18px;
            text-align: left;
            animation: dots 1.2s steps(4, end) infinite;
        }

        @keyframes dots {
            0% { content: ""; }
            25% { content: "."; }
            50% { content: ".."; }
            75% { content: "..."; }
            100% { content: ""; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 920px) {
            .page {
                grid-template-columns: 1fr;
                padding: 10px;
                gap: 10px;
            }

            .sidebar {
                min-height: auto;
            }

            .chat-shell {
                min-height: calc(100vh - 250px);
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <aside class="sidebar">
            <h2 class="brand">aikit chat</h2>
            <p class="tag">interfaz conversacional con historial visible</p>

            <div class="meta">
                <div class="label">conversation id</div>
                <div id="conversationId" class="value">-</div>
            </div>

            <div class="actions">
                <button id="newChatButton" class="btn-primary">Nuevo chat</button>
                <button id="clearHistoryButton" class="btn-light">Limpiar historial local</button>
            </div>

            <div class="help">
                Enter envia mensaje. Shift+Enter añade salto de linea.
            </div>
        </aside>

        <main class="chat-shell">
            <header class="chat-header">
                <h1>Asistente</h1>
                <div id="status" class="status">Listo para conversar</div>
            </header>

            <section id="messages" class="messages" aria-live="polite"></section>

            <footer class="composer">
                <textarea id="messageInput" placeholder="Escribe tu mensaje..."></textarea>
                <button id="sendButton" class="btn-primary send">Enviar</button>
                <div class="hint">El historial se guarda en el navegador mientras trabajas en esta pagina.</div>
            </footer>
        </main>
    </div>

    <script>
        const API_URL = "http://localhost:8000/chat";
        const STORAGE_KEY = "aikit-chat-ui-state-v1";

        const messagesEl = document.getElementById("messages");
        const inputEl = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");
        const statusEl = document.getElementById("status");
        const conversationIdEl = document.getElementById("conversationId");
        const newChatButton = document.getElementById("newChatButton");
        const clearHistoryButton = document.getElementById("clearHistoryButton");

        let state = loadState();

        function makeConversationId() {
            return `web-${Date.now()}`;
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === "object") {
                        return {
                            conversation_id: parsed.conversation_id || makeConversationId(),
                            messages: Array.isArray(parsed.messages) ? parsed.messages : [],
                        };
                    }
                }
            } catch (_err) {
            }
            return {
                conversation_id: makeConversationId(),
                messages: [],
            };
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function setStatus(text) {
            statusEl.textContent = text;
        }

        function autoResize() {
            inputEl.style.height = "auto";
            inputEl.style.height = `${Math.min(inputEl.scrollHeight, 180)}px`;
        }

        function appendMessage(role, content, isError = false) {
            const node = document.createElement("article");
            node.className = `message ${role}${isError ? " error" : ""}`;
            node.textContent = content;
            messagesEl.appendChild(node);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return node;
        }

        function renderMessages() {
            messagesEl.innerHTML = "";
            if (!state.messages.length) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = "Empieza una conversacion. Veras cada turno en este panel para seguir el hilo como en un chat clasico.";
                messagesEl.appendChild(empty);
                return;
            }

            for (const msg of state.messages) {
                appendMessage(msg.role, msg.content, Boolean(msg.error));
            }
        }

        function updateConversationMeta() {
            conversationIdEl.textContent = state.conversation_id;
        }

        function resetConversation() {
            state = {
                conversation_id: makeConversationId(),
                messages: [],
            };
            saveState();
            updateConversationMeta();
            renderMessages();
            setStatus("Nuevo chat listo");
        }

        async function sendMessage() {
            const message = inputEl.value.trim();
            if (!message) {
                setStatus("Escribe un mensaje primero");
                return;
            }

            const previousEmpty = messagesEl.querySelector(".empty");
            if (previousEmpty) {
                previousEmpty.remove();
            }

            state.messages.push({ role: "user", content: message, ts: Date.now() });
            appendMessage("user", message);
            saveState();

            inputEl.value = "";
            autoResize();
            sendButton.disabled = true;
            setStatus("Enviando...");

            const thinkingNode = appendMessage("assistant", "Pensando");
            thinkingNode.classList.add("dot-typing");

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        conversation_id: state.conversation_id,
                        message,
                    }),
                });

                let answerText = "";
                if (response.ok) {
                    const data = await response.json();
                    answerText = (data && data.answer) ? String(data.answer) : "Sin respuesta del servidor";
                } else {
                    const detail = await response.text();
                    throw new Error(`HTTP ${response.status}: ${detail}`);
                }

                thinkingNode.classList.remove("dot-typing");
                thinkingNode.textContent = answerText;

                state.messages.push({ role: "assistant", content: answerText, ts: Date.now() });
                saveState();
                setStatus("Respuesta recibida");
            } catch (err) {
                const errorText = `Error al conectar con ${API_URL}. ${err.message}`;
                thinkingNode.classList.remove("dot-typing");
                thinkingNode.classList.add("error");
                thinkingNode.textContent = errorText;

                state.messages.push({ role: "assistant", content: errorText, error: true, ts: Date.now() });
                saveState();
                setStatus("Error de conexion");
            } finally {
                sendButton.disabled = false;
                inputEl.focus();
            }
        }

        sendButton.addEventListener("click", sendMessage);

        inputEl.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        inputEl.addEventListener("input", autoResize);

        newChatButton.addEventListener("click", () => {
            resetConversation();
            inputEl.focus();
        });

        clearHistoryButton.addEventListener("click", () => {
            localStorage.removeItem(STORAGE_KEY);
            resetConversation();
        });

        updateConversationMeta();
        renderMessages();
        autoResize();
        inputEl.focus();
    </script>
</body>
</html>
